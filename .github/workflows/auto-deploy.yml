name: Auto deploy (claude branches)

# Every push to a claude/** branch is verified and, if everything passes,
# merged into main. Vercel then deploys main as usual.
on:
  push:
    branches: ["claude/**"]

concurrency:
  group: auto-deploy-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  merge:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge branch into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          # Fails (and leaves main untouched) on conflicts
          git merge --no-ff "origin/$BRANCH" -m "Auto-merge $BRANCH into main"
          git push origin main
